[project]
name = "ramo-diarization"
version = "0.1.0"
description = "Sovereign Speaker Diarization & Voiceprint Harvester Microservice (Pyannote + StenoAI Crosstalk Rejection + Demucs)"
authors = [{ name = "Omar Jomaa", email = "iamomarjomaa@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "soundfile>=0.12.1",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramo_speaker"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "../common/src"]
asyncio_mode = "auto"
