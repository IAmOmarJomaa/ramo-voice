[project]
name = "ramo-gateway"
version = "0.1.0"
description = "Sovereign Real-Time Voice Duplex Gateway with Barge-in & VAD State Machine"
authors = [{ name = "Omar Jomaa", email = "iamomarjomaa@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramo_gateway"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [
    "src",
    "../common/src",
    "../enhancement/src",
    "../stt/src",
    "../diarization/src",
    "../translation/src",
    "../tts/src",
]
asyncio_mode = "auto"
