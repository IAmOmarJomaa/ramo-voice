[project]
name = "ramo-translate"
version = "0.1.0"
description = "Sovereign Real-Time Meeting Translation & LLM Intelligence Microservice"
authors = [{ name = "Omar Jomaa", email = "iamomarjomaa@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
vllm = [
    "torch>=2.0.0",
    "vllm>=0.6.0",
    "transformers>=4.40.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ramo_translate"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "../common/src"]
asyncio_mode = "auto"
